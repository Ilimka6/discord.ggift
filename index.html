<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Discord Nitro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #ff0000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Courier New', monospace;
            overflow: hidden;
        }
        h1 {
            font-size: 8vw;
            text-transform: uppercase;
            animation: blink 0.5s infinite;
            text-align: center;
        }
        p {
            font-size: 3vw;
            color: #0f0;
            margin-top: 20px;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }
        .matrix {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.1;
            pointer-events: none;
            font-size: 14px;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="matrix" id="matrix"></div>
    <h1>⚠️ ТЫ ЗАТРОЛЛЕН ⚠️</h1>
    <p>И "взломан" хахаха 😈</p>
    <script>
        const chars = "01";
        let output = "";
        for(let i = 0; i < 3000; i++) {
            output += chars[Math.floor(Math.random() * 2)];
        }
        document.getElementById('matrix').innerText = output;
    </script>
</body>
</html>
